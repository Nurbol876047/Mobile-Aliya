# APK-ны бұлтта құрастыру: жергілікті компьютерге Flutter/Android SDK қажет емес.
# Flutter жобасы репозиторийдің _src/ қалтасында жатыр, сондықтан барлық қадамдар
# сол қалтада орындалады (defaults.run.working-directory).
# Нәтиже: Actions → жұмыс → Artifacts → floracare-apk (≈30 МБ).
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: _src

# Барлық нұсқа (APK, iOS, веб) бір серверге қосылады. Басқа сервер керек болса:
# Settings → Secrets and variables → Actions → vars.AI_BACKEND_URL
env:
  AI_BACKEND_URL: ${{ vars.AI_BACKEND_URL || 'https://floracare-backend-ynkm.onrender.com' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=AI_BACKEND_URL=$AI_BACKEND_URL

      - uses: actions/upload-artifact@v4
        with:
          name: floracare-apk
          path: _src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Веб-нұсқаны да жинап, артефакт ретінде береміз (қаласаңыз, браузерден ашуға).
      - name: Build web
        run: flutter build web --release --dart-define=AI_BACKEND_URL=$AI_BACKEND_URL

      - uses: actions/upload-artifact@v4
        with:
          name: floracare-web
          path: _src/build/web
