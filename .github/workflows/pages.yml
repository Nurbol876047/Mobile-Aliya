# GitHub Pages-ті қолданбаның сол бір кодынан (_src/) автоматты түрде жаңартады:
# https://nurbol876047.github.io/Mobile-Aliya/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: _src

env:
  AI_BACKEND_URL: ${{ vars.AI_BACKEND_URL || 'https://floracare-backend-ynkm.onrender.com' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: >
          flutter build web --release
          --base-href /Mobile-Aliya/
          --dart-define=AI_BACKEND_URL=$AI_BACKEND_URL

      # gh-pages тармағы — тек жиналған нәтиже, тарихы сақталмайды
      - name: Publish to gh-pages
        working-directory: _src/build/web
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy FloraCare web build ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
