# APK-ны бұлтта құрастыру: жергілікті компьютерге Flutter/Android SDK қажет емес.
# Нәтиже: Actions → жұмыс → Artifacts → floracare-apk (≈30 МБ).
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # ЖИ баптауы (міндетті емес): Settings → Secrets and variables → Actions
      #   vars.AI_BACKEND_URL    — сервердің мекенжайы (ұсынылады, кілт серверде қалады)
      #   secrets.GEMINI_API_KEY — тікелей режим (кілт APK ішіне енеді, тек демо үшін)
      # Екеуі де бос болса, қолданба ЖИ-сіз, тек түс талдауымен жұмыс істейді.
      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: floracare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Веб-нұсқаны да жинап, артефакт ретінде береміз (қаласаңыз, браузерден ашуға).
      - name: Build web
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: floracare-web
          path: build/web
