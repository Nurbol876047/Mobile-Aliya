name: flora_care
description: "FloraCare — фото арқылы өсімдік денсаулығын бақылау (Android/iOS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  image: ^4.2.0
  shared_preferences: ^2.2.0
  http: ^1.2.0
  material_ui: ^1.11.1
  web: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plants/
